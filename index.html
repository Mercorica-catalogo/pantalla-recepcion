<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticker Corporativo con Logo</title>
    <style>
        /* Reseteo básico para pantalla completa */
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: Arial, sans-serif; }

        /* Contenedor principal de la pantalla */
        .pantalla-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

        /* Área superior: Ocupa el 88% de la pantalla para el Video */
        .zona-video { width: 100%; height: 88vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Área inferior: Ocupa el 12% de la pantalla para el Cintillo Estilo CNN */
        .zona-ticker { 
            width: 100%; 
            height: 12vh; 
            background-color: #cc0000; /* Color rojo de fondo para el texto */
            display: flex; 
            align-items: center; 
            box-shadow: 0px -5px 15px rgba(0,0,0,0.5);
            border-top: 4px solid #fff; /* Línea divisoria blanca superior */
            position: relative;
        }

        /* 1. BLOQUE FIJO IZQUIERDO: Contenedor del Logo de la Empresa */
        .bloque-logo {
            width: 18vw; /* Ocupa el 18% del ancho de la pantalla */
            height: 100%;
            background-color: #1a1a1a; /* Fondo oscuro elegante para contrastar el logo */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            border-right: 3px solid #fff; /* Línea divisoria blanca vertical */
            z-index: 10; /* Se asegura de quedar por encima del texto en movimiento */
            position: absolute;
            left: 0;
            top: 0;
        }

        /* Ajuste de la imagen del logo corporativo */
        .bloque-logo img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
        }

        /* 2. BLOQUE DINÁMICO DERECHO: Contenedor del texto en movimiento */
        .marquesina-container { 
            width: 82vw; /* Ocupa el resto del ancho de la pantalla (100% - 18%) */
            overflow: hidden; 
            white-space: nowrap; 
            position: absolute;
            left: 18vw; /* Empieza exactamente donde termina el bloque del logo */
            height: 100%;
            display: flex;
            align-items: center;
        }
        
        .marquesina-texto {
            display: inline-block;
            padding-left: 100%; /* Empieza a aparecer desde el extremo derecho externo */
            font-size: 3.8vh; /* Tamaño de letra responsivo */
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            animation: marchar 30s linear infinite; /* Más segundos = movimiento más suave y pausado */
        }

        /* Animación CSS moderna para el desplazamiento fluido */
        @keyframes marchar {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="pantalla-container">
        <!-- ZONA DEL VIDEO CORPORATIVO -->
        <div class="zona-video">
            <!-- Reemplaza el enlace de abajo por la URL directa de tu video MP4 corporativo -->
            <video autoplay muted loop playsinline>
                <source src="https://mixkit.co" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </div>

        <!-- ZONA DE LA BARRA DE NOTICIAS (ESTILO CNN) -->
        <div class="zona-ticker">
            
            <!-- BLOQUE FIJO: Logo de la Empresa -->
            <div class="bloque-logo">
                <!-- Reemplaza la URL de abajo por el enlace directo de tu logo (PNG transparente recomendado) -->
                <img src="https://ablesign.tv" alt="Logo Empresa">
            </div>

            <!-- BLOQUE CON MOVIMIENTO: Noticias -->
            <div class="marquesina-container">
                <div class="marquesina-texto">
                    📢 BIENVENIDOS A LA PANTALLA CORPORATIVA — 🚀 RECORDATORIO: Próxima reunión general el viernes a las 10:00 AM — 🌟 ¡Felicitaciones al equipo de ventas por alcanzar la meta mensual! — 🔒 Mantén tus contraseñas seguras y reporta correos sospechosos a TI.
                </div>
            </div>

        </div>
    </div>

</body>
</html>
