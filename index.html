<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticker Corporativo Automático</title>
    <style>
        /* Reseteo para pantalla completa sin barras de desplazamiento */
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: Arial, sans-serif; }

        /* Contenedor principal */
        .pantalla-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

        /* Área superior: Video */
        .zona-video { width: 100%; height: 88vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Área inferior: Cintillo completo */
        .zona-ticker { 
            width: 100%; 
            height: 12vh; 
            background-color: #ffffff; /* Fondo Blanco para las noticias */
            display: flex; 
            align-items: center; 
            box-shadow: 0px -5px 15px rgba(0,0,0,0.5);
            border-top: 4px solid #fff; 
            position: relative;
        }

        /* 1. BLOQUE FIJO IZQUIERDO: Logo de la Empresa */
        .bloque-logo {
            width: 18vw; 
            height: 100%;
            background-color: #ffffff; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            /*border-right: 3px solid #001689;*/ 
            box-shadow: 6px 0px 10px rgba(0, 0, 0, 0.1); 
            z-index: 10; /* Se mantiene al frente tapando el texto */
            position: absolute;
            left: 0;
            top: 0;
        }

        .bloque-logo img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
        }

        /* 2. BLOQUE DINÁMICO DERECHO: Contenedor de la marquesina */
        .marquesina-container { 
            width: 82vw; 
            height: 100%;
            overflow: hidden; 
            position: absolute;
            left: 18vw; 
            display: flex;
            align-items: center;
        }
        
        /* SOLUCIÓN AL TEXTO CORTE: Forzar ancho máximo dinámico y evitar colapsos */
        .marquesina-track {
            display: inline-flex;
            white-space: nowrap;
            width: max-content; /* Fuerza al contenedor a expandirse todo lo que mida el texto */
            will-change: transform;
            -webkit-animation: marchar 35s linear infinite;
            animation: marchar 35s linear infinite; /* Si pones un texto MUY largo, sube este valor a 45s o 50s para que vaya más lento */
        }

        .marquesina-texto {
            font-size: 3.8vh; 
            font-weight: bold;
            color: #001689; 
            text-transform: uppercase;
            padding-right: 100vw; /* Añade un espacio gigante al final para que el texto termine de pasar antes de reiniciar */
        }

        /* ANIMACIÓN AUTOMÁTICA COMPATIBLE: Se adapta a cualquier longitud de texto */
        @-webkit-keyframes marchar {
            0% { -webkit-transform: translate3d(82vw, 0, 0); transform: translate3d(82vw, 0, 0); }
            100% { -webkit-transform: translate3d(-100%, 0, 0); transform: translate3d(-100%, 0, 0); }
        }

        @keyframes marchar {
            0% { -webkit-transform: translate3d(82vw, 0, 0); transform: translate3d(82vw, 0, 0); }
            100% { -webkit-transform: translate3d(-100%, 0, 0); transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="pantalla-container">
        <!-- ZONA DEL VIDEO CORPORATIVO -->
        <div class="zona-video">
            <video autoplay muted loop playsinline>
                <source src="https://mixkit.co" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </div>

        <!-- ZONA DE LA BARRA DE NOTICIAS (ESTILO CNN) -->
        <div class="zona-ticker">
            
            <!-- BLOQUE FIJO: Logo de la Empresa -->
            <div class="bloque-logo">
                <img src="https://raw.githubusercontent.com/Mercorica-catalogo/pantalla-recepcion/972fc29f761b973be26175a513df04fa2873ba64/Mercorica.svg" alt="Logo Empresa">
            </div>

            <!-- BLOQUE CON MOVIMIENTO: Noticias -->
            <div class="marquesina-container">
                <div class="marquesina-track">
                    <!-- Puedes agregar el texto del largo que desees dentro de este span y se adaptará solo -->
                    <span class="marquesina-texto">
                        📢 BIENVENIDOS A LA PANTALLA CORPORATIVA — 🚀 RECORDATORIO: Próxima reunión general el viernes a las 10:00 AM — 🌟 ¡Felicitaciones al equipo de ventas por alcanzar la meta mensual! — 🔒 Mantén tus contraseñas seguras y reporta correos sospechosos a TI.
                    </span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
