<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticker Corporativo Corregido</title>
    <style>
        /* Reseteo para pantalla completa sin barras de desplazamiento */
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        body, html { width: 100%; height: 100%; background-color: #000; font-family: Arial, sans-serif; }

        /* Contenedor principal */
        .pantalla-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

        /* Área superior: Video */
        .zona-video { width: 100%; height: 88vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Área inferior: Cintillo completo */
        .zona-ticker { 
            width: 100%; 
            height: 12vh; 
            background-color: #cc0000; /* Color rojo de fondo para las noticias */
            display: flex; 
            align-items: center; 
            box-shadow: 0px -5px 15px rgba(0,0,0,0.5);
            border-top: 4px solid #fff; 
            position: relative;
        }

        /* 1. BLOQUE FIJO IZQUIERDO: Logo de la Empresa */
        .bloque-logo {
            width: 18vw; 
            height: 100%;
            background-color: #1a1a1a; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            border-right: 3px solid #fff; 
            z-index: 10; /* Se mantiene al frente tapando el texto que pasa por debajo */
            position: absolute;
            left: 0;
            top: 0;
        }

        .bloque-logo img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
        }

        /* 2. BLOQUE DINÁMICO DERECHO: Contenedor de la marquesina */
        .marquesina-container { 
            width: 82vw; 
            height: 100%;
            overflow: hidden; 
            position: absolute;
            left: 18vw; /* Comienza exactamente al terminar el logo */
            display: flex;
            align-items: center;
        }
        
        /* Contenedor interno que fuerza una sola línea y ejecuta la animación */
        .marquesina-track {
            display: flex;
            white-space: nowrap;
            padding-left: 100vw; /* Empuja el inicio del texto fuera de la pantalla derecha */
            -webkit-animation: marchar 30s linear infinite;
            animation: marchar 30s linear infinite; /* Controla la velocidad aquí */
        }

        .marquesina-texto {
            font-size: 3.8vh; 
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            display: block;
        }

        /* ANIMACIÓN CORREGIDA: Compatible con Android TV (Chrome/Webview viejo y nuevo) */
        @-webkit-keyframes marchar {
            0% { -webkit-transform: translateX(0); transform: translateX(0); }
            100% { -webkit-transform: translateX(-100%); transform: translateX(-100%); }
        }

        @keyframes marchar {
            0% { -webkit-transform: translateX(0); transform: translateX(0); }
            100% { -webkit-transform: translateX(-100%); transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div class="pantalla-container">
        <!-- ZONA DEL VIDEO CORPORATIVO -->
        <div class="zona-video">
            <video autoplay muted loop playsinline>
                <source src="https://mixkit.co" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </div>

        <!-- ZONA DE LA BARRA DE NOTICIAS (ESTILO CNN) -->
        <div class="zona-ticker">
            
            <!-- BLOQUE FIJO: Logo de la Empresa -->
            <div class="bloque-logo">
                <img src="https://ablesign.tv" alt="Logo Empresa">
            </div>

            <!-- BLOQUE CON MOVIMIENTO: Noticias -->
            <div class="marquesina-container">
                <div class="marquesina-track">
                    <span class="marquesina-texto">
                        📢 BIENVENIDOS A LA PANTALLA CORPORATIVA — 🚀 RECORDATORIO: Próxima reunión general el viernes a las 10:00 AM — 🌟 ¡Felicitaciones al equipo de ventas por alcanzar la meta mensual! — 🔒 Mantén tus contraseñas seguras y reporta correos sospechosos a TI.
                    </span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
